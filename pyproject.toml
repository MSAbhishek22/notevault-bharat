[project]
name = "notevault-bharat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

# Vercel entrypoint: the Python runtime loads `application` from
# notes_bharat.wsgi and routes EVERY request to it with the original
# path, so the app deploys as-is — no vercel.json rewrite. (A rewrite
# to /api/index used to mask every path as PATH_INFO=/api/index and
# made the live app 404 on /, /api/status and everything else; see
# deployment/VERCEL_ROUTING_FIX.md.)
[tool.vercel]
entrypoint = "notes_bharat.wsgi:application"
